# PR check: generated docs + Docusaurus config must produce a successful site build.
# Automated docs PRs (docs/regenerate-*) are squash-merged when this job succeeds.
name: Build

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Auto-merge docs PR
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'docs/regenerate-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --squash --delete-branch "${{ github.event.pull_request.number }}"
